<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 16 - Danh sách việc cần làm</title>
  <style>
     /* Mã màu: #64748b #fca5a5 #b91c1c #fde2e2 #94a3b8 #1e293b #a78bfa #ede9fe #e2e8f0 #ffffff #f1f3f9 #5b21b6 #6d28d9 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: #f1f3f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .todo-app {
      width: 100%;
      max-width: 600px;
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .app-header {
      background-color: #6d28d9;
      color: #ffffff;
      padding: 24px 30px;
    }

    .app-header h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .app-header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .app-body {
      padding: 24px 30px;
    }

    .input-group {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .input-group input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: #6d28d9;
    }

    .btn-add {
      background-color: #6d28d9;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-add:hover {
      background-color: #5b21b6;
    }

    .todo-list {
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px dashed #ede9fe;
    }

    .todo-content {
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      flex: 1;
    }

    .checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid #a78bfa;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .todo-text {
      font-size: 15px;
      color: #1e293b;
      transition: all 0.2s;
    }

    .todo-item.completed .checkbox {
      background-color: #6d28d9;
      border-color: #6d28d9;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #94a3b8;
    }

    .btn-delete {
      background-color: #fde2e2;
      color: #b91c1c;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-delete:hover {
      background-color: #fca5a5;
    }

    .todo-footer {
      margin-top: 24px;
      font-size: 14px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="todo-app">

    <div class="app-header">
      <h1>Danh sách việc cần làm</h1>
      <p>Thêm việc mới, đánh dấu hoàn thành hoặc xoá — tất cả bằng JavaScript.</p>
    </div>

    <div class="app-body">

      <div class="input-group">
        <input type="text" id="todoInput" placeholder="Hoàn thành bài tập Lập trình Web" onkeypress="handleKeyPress(event)">
        <button class="btn-add" onclick="addTodo()">Thêm</button>
      </div>


      <ul class="todo-list" id="todoList">

        <li class="todo-item completed">
          <div class="todo-content" onclick="toggleComplete(this)">
            <div class="checkbox"></div>
            <span class="todo-text">Đọc chương HTML5 cơ bản</span>
          </div>
          <button class="btn-delete" onclick="deleteTodo(this)">Xoá</button>
        </li>

        <li class="todo-item">
          <div class="todo-content" onclick="toggleComplete(this)">
            <div class="checkbox"></div>
            <span class="todo-text">Làm bài tập CSS Grid</span>
          </div>
          <button class="btn-delete" onclick="deleteTodo(this)">Xoá</button>
        </li>

        <li class="todo-item">
          <div class="todo-content" onclick="toggleComplete(this)">
            <div class="checkbox"></div>
            <span class="todo-text">Quay video OBS nộp bài</span>
          </div>
          <button class="btn-delete" onclick="deleteTodo(this)">Xoá</button>
        </li>
      </ul>

      <div class="todo-footer" id="todoCount">
        Còn 2 việc chưa hoàn thành
      </div>
    </div>
  </div>

  <script>
    const todoInput = document.getElementById('todoInput');
    const todoList = document.getElementById('todoList');
    const todoCount = document.getElementById('todoCount');

    function updateRemainingCount() {
      const allItems = todoList.querySelectorAll('.todo-item');
      const completedItems = todoList.querySelectorAll('.todo-item.completed');
      const remaining = allItems.length - completedItems.length;
      
      todoCount.textContent = `Còn ${remaining} việc chưa hoàn thành`;
    }

    function addTodo() {
      const text = todoInput.value.trim();
      if (text === '') return;

      const li = document.createElement('li');
      li.className = 'todo-item';
      li.innerHTML = `
        <div class="todo-content" onclick="toggleComplete(this)">
          <div class="checkbox"></div>
          <span class="todo-text">${escapeHtml(text)}</span>
        </div>
        <button class="btn-delete" onclick="deleteTodo(this)">Xoá</button>
      `;

      todoList.appendChild(li);
      todoInput.value = '';
      todoInput.focus();
      updateRemainingCount();
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        addTodo();
      }
    }

    function toggleComplete(contentElem) {
      const todoItem = contentElem.closest('.todo-item');
      todoItem.classList.toggle('completed');
      updateRemainingCount();
    }

    function deleteTodo(btnElem) {
      const todoItem = btnElem.closest('.todo-item');
      todoItem.remove();
      updateRemainingCount();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
    }

    updateRemainingCount();
  </script>

</body>
</html>
